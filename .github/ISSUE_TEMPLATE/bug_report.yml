name: Bug report
description: Report a reproducible product or engineering defect.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Remove all secrets, personal data, and real transaction information before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, browser, runtime, and deployment context.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Risk and impact
      description: Include any effect on scoring, decisions, auditability, or data integrity.
    validations:
      required: true
